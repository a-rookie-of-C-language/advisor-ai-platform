name: Agent Evaluation CI

on:
  pull_request:
    branches: [master, main]
    paths:
      - 'agent/**'
  push:
    branches: [master, main]
    paths:
      - 'agent/**'

jobs:
  evaluation:
    name: DeepEval Agent Evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Probe DeepEval model availability
        id: deepeval_probe
        working-directory: agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          DEEPEVAL_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: |
          python - <<'PY'
          import os
          import sys
          from openai import OpenAI

          api_key = os.environ["OPENAI_API_KEY"].strip()
          base_url = os.environ.get("OPENAI_BASE_URL", "").strip() or None
          model = os.environ.get("DEEPEVAL_MODEL", "").strip()
          client = OpenAI(api_key=api_key, base_url=base_url)
          output_path = os.environ["GITHUB_OUTPUT"]

          def write_available(value: bool) -> None:
              with open(output_path, "a", encoding="utf-8") as handle:
                  handle.write(f"available={'true' if value else 'false'}\n")

          try:
              client.chat.completions.create(
                  model=model,
                  messages=[{"role": "user", "content": "ping"}],
                  max_tokens=1,
              )
          except Exception as exc:  # noqa: BLE001
              print(f"DeepEval model probe failed: {exc}", file=sys.stderr)
              write_available(False)
          else:
              write_available(True)
          PY

      - name: Run DeepEval evaluation tests
        if: steps.deepeval_probe.outputs.available == 'true'
        working-directory: agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          DEEPEVAL_MODEL: ${{ secrets.OPENAI_MODEL }}
          RUN_DEEPEVAL_TESTS: true
          DEEPEVAL_PER_ATTEMPT_TIMEOUT_SECONDS_OVERRIDE: 300
        run: |
          python -m pytest tests/evaluation/test_evaluation.py -v --tb=short --junitxml=evaluation-report.xml

      - name: Skip DeepEval evaluation
        if: steps.deepeval_probe.outputs.available != 'true'
        run: |
          echo "DeepEval model is unavailable on the configured OpenAI-compatible backend, skipping evaluation job."

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: |
            agent/.deepeval/.latest_run_full.json
            agent/evaluation-report.xml

      - name: Check evaluation results
        if: failure()
        run: |
          echo "❌ Agent evaluation tests failed. Please fix the issues before merging."
          echo ""
          echo "Common issues:"
          echo "  - Contextual Recall below threshold: Add more retrieval context"
          echo "  - Coherence below threshold: Improve answer structure"
          echo "  - Hallucination detected: Check for factual accuracy"
          exit 1
