name: Lint

on:
  push:
    branches: ["master", "refactor/**"]
  pull_request:
    branches: ["master", "refactor/**"]

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-agent:
    name: Agent (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-ts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: agent-ts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run check

  lint-frontend:
    name: Frontend (ESLint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  lint-java:
    name: Java (Spotless + Checkstyle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"

      - name: Spotless check
        run: mvn -q -DskipTests spotless:check

      - name: Checkstyle check
        run: mvn -q -DskipTests checkstyle:check
