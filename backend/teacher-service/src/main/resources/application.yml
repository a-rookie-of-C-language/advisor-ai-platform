server:
  port: 8089

spring:
  config:
    import: optional:nacos:advisor-ai-platform-common.yaml
  application:
    name: teacher-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        file-extension: yaml
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:advisor_ai}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_schema_history_teacher

advisor:
  internal:
    token: ${INTERNAL_SERVICE_TOKEN:}
  jwt:
    secret: ${JWT_SECRET:${ADVISOR_JWT_SECRET:}}
    expiration: ${JWT_EXPIRE_MS:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
